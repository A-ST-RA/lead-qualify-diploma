        - heading "Проблемы без приоритизации" [level=2]
        - paragraph: Когда CRM — это просто список по порядку, у менеджеров нет ориентира. Все заявки выглядят одинаково — и драгоценное время утекает впустую.
        - generic:
          - generic:
            - generic: 01 / ПРОБЛЕМА
            - heading "Часы уходят на «мусор»" [level=4]
            - paragraph: Случайные клики, нерелевантные лиды и нецелевой бюджет отнимают время, которое можно было потратить на реальных клиентов.
          - generic:
            - generic: 02 / ПРОБЛЕМА
            - heading "Горячие лиды остывают" [level=4]
            - paragraph: Перспективный клиент ждёт в очереди и теряет интерес, пока менеджер доделывает предыдущий звонок. Деньги уходят к конкурентам.
          - generic:
            - generic: 03 / ПРОБЛЕМА
            - heading "Решения вслепую" [level=4]
            - paragraph: Непонятно, какой лид стоит внимания в первую очередь. Приоритет ставится интуитивно, а не на основе данных.
